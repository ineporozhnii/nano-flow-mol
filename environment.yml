name: nanoflow
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.5
  - pytorch-cuda=12.1
  - rdkit
  - numpy
  - scipy
  - matplotlib
  - pillow
  - tqdm
  - pip
  - pip:
      - torch-geometric
      - pyscf
      - geometric
      - gpu4pyscf-cuda12x
      - cupy-cuda12x[ctk]
      - xyzrender
